<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Wealth Bible">

<meta name="description" content="The Wealth Bible: a free self-study system for BRRRR real estate investors. Lessons, flashcards, quizzes, calculators, and Florida and Ohio guides.">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>The Wealth Bible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#121212;--panel:#1A1A1A;--card:#202020;--border:#303030;
  --green:#39FF14;--green2:#59E44D;--orange:#F4A300;--red:#FF4D4F;--blue:#3B82F6;
  --white:#fff;--gray-l:#D1D5DB;--gray-m:#9CA3AF;--gray-d:#4B5563;--success:#22C55E;
  --fs:16px; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--white);font-family:Inter,-apple-system,Arial,sans-serif;font-size:var(--fs);line-height:1.55;-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,select,textarea{font-family:inherit;color:inherit}
input,select,textarea{font-size:16px}
a{color:var(--blue)}
h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700}
h3{font-size:17px;font-weight:700}
.muted{color:var(--gray-m)}.small{font-size:13px}.tiny{font-size:11px}
.green{color:var(--green)}.orange{color:var(--orange)}.red{color:var(--red)}.blue{color:var(--blue)}
.topbar{position:sticky;top:0;z-index:100;background:rgba(26,26,26,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;min-height:56px}
.topbar .back{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:22px;display:none;align-items:center;justify-content:center;flex-shrink:0}
.topbar.has-back .back{display:flex}
.logo{width:34px;height:34px;border-radius:8px;background:var(--green);color:#000;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar.has-back .logo{display:none}
.tb-title{flex:1;min-width:0}
.tb-title .t1{font-size:14px;font-weight:800;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title .t2{font-size:11px;color:var(--green);letter-spacing:.06em;text-transform:uppercase;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jump{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;flex-shrink:0}
#view{padding:16px 16px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.card.tap{cursor:pointer}.card.tap:active{border-color:var(--green)}
.rowx{display:flex;gap:10px}.rowx>*{flex:1;min-width:0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center}
.stat .n{font-size:24px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--gray-m);letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
.label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin:18px 0 10px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:100px}
.pill-g{background:rgba(57,255,20,.14);color:var(--green)}.pill-x{background:var(--border);color:var(--gray-m)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:16px;font-weight:700;cursor:pointer;text-align:center}
.btn:active{opacity:.8}.btn.primary{background:var(--green);color:#000;border-color:var(--green)}
.btn.ghost{background:transparent}.btn.sm{min-height:42px;font-size:14px;width:auto;padding:8px 14px}.btn:disabled{opacity:.35}
.bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 12px;border-bottom:1px solid var(--border);cursor:pointer;min-height:56px}
.list-item:last-child{border-bottom:none}
.list-item .ic{font-size:22px;width:30px;text-align:center;flex-shrink:0}
.list-item .body{flex:1;min-width:0}.list-item .ttl{font-weight:600;font-size:16px}
.list-item .sub{font-size:13px;color:var(--gray-m);margin-top:2px}.list-item .chev{color:var(--gray-d);font-size:18px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;color:#000;font-weight:800}
.check.on{background:var(--green);border-color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;min-height:96px;cursor:pointer}
.tile .ic{font-size:26px}.tile .t{font-weight:700;margin-top:6px;font-size:15px}.tile .s{font-size:12px;color:var(--gray-m)}
.lesson .meta{color:var(--gray-m);font-size:13px;margin-bottom:6px}
.block{margin-bottom:16px}
.block h3{color:var(--green);font-size:calc(var(--fs) + 1px);margin-bottom:6px}
.block p{color:var(--gray-l);font-size:var(--fs);line-height:1.68;margin-bottom:8px}
.formula{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-family:'SF Mono',Menlo,monospace;font-size:15px;color:var(--green);line-height:1.6;overflow-x:auto;white-space:pre-wrap}
.example,.carry,.trap{border-radius:10px;padding:12px 14px;font-size:var(--fs);line-height:1.6}
.example{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.3);color:var(--gray-l)}
.carry{background:rgba(57,255,20,.08);border:1px solid rgba(57,255,20,.35);font-weight:600}
.trap{background:rgba(255,77,79,.08);border:1px solid rgba(255,77,79,.35);color:var(--gray-l)}
.example b,.carry b,.trap b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.example b{color:var(--blue)}.carry b{color:var(--green)}.trap b{color:var(--red)}
.state{display:grid;grid-template-columns:1fr;gap:8px}
.state div{border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--gray-l);font-size:15px}
.state div b{color:var(--orange);font-size:11px;letter-spacing:.1em;display:block;margin-bottom:3px}
.sources{font-size:13px;color:var(--gray-m)}.sources a{display:block;margin:5px 0;word-break:break-word}
.listen{display:flex;gap:8px;align-items:center;margin:10px 0 16px;flex-wrap:wrap}
.listen select{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0 10px;height:42px}
.lesson-nav{display:flex;gap:8px;margin-top:12px}
.fc-wrap{perspective:1200px;height:320px;margin:12px 0}
.fc{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--border);background:var(--card);padding:20px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.fc .b{transform:rotateY(180deg);border-color:rgba(57,255,20,.4)}
.fc .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:10px;color:var(--green)}
.fc .q{font-size:19px;font-weight:600;line-height:1.4}.fc .a{font-size:17px;color:var(--green);line-height:1.5;font-weight:500}
.fc .hint{font-size:12px;color:var(--gray-d);margin-top:12px}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade button{min-height:56px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.grade button small{font-size:11px;color:var(--gray-m);font-weight:500}
.grade .g0{border-color:var(--red);color:var(--red)}.grade .g1{border-color:var(--orange);color:var(--orange)}
.grade .g2{border-color:var(--success);color:var(--success)}.grade .g3{border-color:var(--green);color:var(--green)}
.qq{font-size:19px;font-weight:600;line-height:1.4;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:16px;margin-bottom:8px;min-height:52px}
.opt.right{border-color:var(--success);background:rgba(34,197,94,.12)}.opt.wrong{border-color:var(--red);background:rgba(255,77,79,.12)}
.explain{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:15px;color:var(--gray-l);margin:10px 0}
.score-big{text-align:center;padding:24px 0}.score-big .pct{font-size:64px;font-weight:800;color:var(--green);line-height:1}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gray-m);margin-bottom:5px}
.f input,.f select{width:100%;min-height:46px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.f input:focus,.f select:focus{outline:none;border-color:var(--green)}
.rr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);gap:10px}
.rr:last-child{border-bottom:none}.rr .l{color:var(--gray-m);font-size:15px}.rr .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.verdict{margin-top:12px;padding:12px;border-radius:10px;font-weight:700;text-align:center}
.verdict.ok{background:rgba(34,197,94,.15);color:var(--success)}.verdict.bad{background:rgba(255,77,79,.15);color:var(--red)}.verdict.warn{background:rgba(244,163,0,.15);color:var(--orange)}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:44px;background:var(--panel);border:none;font-weight:600;font-size:14px}.seg button.on{background:var(--green);color:#000}
.rep{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rep button{min-height:64px;border-radius:12px;border:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700}
.rep button .n{font-size:22px;color:var(--green)}.rep button .l{font-size:11px;color:var(--gray-m);text-align:center}
.search{width:100%;min-height:48px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.scr{white-space:pre-wrap;color:var(--gray-l);line-height:1.7;font-size:var(--fs)}
.scr .you{color:var(--green);font-weight:700}.scr .them{color:var(--orange);font-weight:700}
.cb{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.cb:last-of-type{border-bottom:none}
.cb .box{width:24px;height:24px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#000;font-weight:800}
.cb.on .box{background:var(--green);border-color:var(--green)}
textarea.notes{width:100%;min-height:110px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:200;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(26,26,26,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{min-height:58px;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--gray-m)}
.tabs button .ic{font-size:22px;line-height:1;filter:grayscale(1) opacity(.65)}
.tabs button.on{color:var(--green)}.tabs button.on .ic{filter:none}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none}.sheet-bg.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:85vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--border);padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--gray-d);margin:4px auto 12px}
.sheet .jm{padding:12px 10px;border-radius:10px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;cursor:pointer}
.sheet .jm:active,.sheet .jl:active{background:var(--card)}
.sheet .jl{padding:10px 10px 10px 16px;font-size:15px;color:var(--gray-l);cursor:pointer;border-left:2px solid var(--border);margin-left:22px}
.sheet .jl.read{color:var(--gray-d)}
.banner{position:fixed;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top));z-index:400;background:var(--green);color:#000;border-radius:12px;padding:10px 12px;font-weight:700;display:none;justify-content:space-between;align-items:center;gap:10px}
.banner.show{display:flex}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--green);color:var(--white);padding:10px 16px;border-radius:100px;font-weight:600;font-size:14px;z-index:500;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.path{display:flex;align-items:center;gap:6px;margin:4px 0 14px}
.path .st{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer}
.path .st.done{border-color:rgba(57,255,20,.55)}
.path .st .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-m)}
.path .st .v{font-weight:800;font-size:15px;margin-top:2px}
.path .ar{color:var(--gray-d)}
.about p{color:var(--gray-l);margin-bottom:10px}
@media (min-width:520px){.state{grid-template-columns:1fr 1fr}}
</style>
</head>
